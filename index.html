<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNDA 數位創意創業思維｜MVP 檢視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-heading:"Inter Tight","Helvetica Neue",Arial,"Noto Sans TC",sans-serif;
  --font-body:"Inter Tight","Helvetica Neue",Arial,"Noto Sans TC",sans-serif;
  --bg:#0C0C0F; --ink:#F2F2F2; --muted:#8E8E8A; --stamp:#FF4F2B; --accent:#FF4F2B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#scene{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%;cursor:default}
#scene.hot{cursor:pointer}

/* ── navbar ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(12,12,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1)}
.nav .navprog{display:none;position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .6s ease;pointer-events:none}
@media(min-width:640px){.nav{padding:16px 32px}}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo b{font-family:var(--font-heading);font-weight:500;font-size:21px;letter-spacing:-.025em;line-height:1}
.logo b sup{font-size:.45em;vertical-align:super;margin-left:1px}
.logo .course{font-size:14px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
@media(min-width:640px){.logo .course{font-size:15px}}
.logo i{font-style:normal;font-size:25px;line-height:1;letter-spacing:-.02em;user-select:none}
@media(min-width:640px){.logo b{font-size:26px}.logo i{font-size:30px}}
.links{display:none;font-size:23px;letter-spacing:-.01em}
.links a,.cta{text-decoration:none;cursor:pointer;transition:opacity .2s;background:none;border:0;padding:0}
.links a:hover,.cta:hover{opacity:.6}
.links a[aria-current="true"]{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;text-decoration-color:var(--accent)}
.cta{display:none;font-size:16px;color:var(--muted);letter-spacing:.02em}
.cta:hover{opacity:1;color:var(--ink)}
@media(min-width:768px){.cta{display:inline}.burger{display:none!important}}
.burger{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:14px 10px;margin:-14px -10px;cursor:pointer;position:relative;z-index:11}
.burger span{display:block;width:24px;height:2px;background:var(--ink);transition:transform .3s,opacity .3s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:9;background:rgba(12,12,15,.95);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 32px;gap:32px;opacity:0;pointer-events:none;transition:opacity .3s}
.menu.open{opacity:1;pointer-events:auto}
.menu a,.menu button{font-size:32px;font-weight:500;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;letter-spacing:-.02em}
.menu .u{text-decoration:underline;text-underline-offset:4px}
@media(min-width:768px){.menu{display:none}}

/* ── hero ── */
.hero{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 64px;pointer-events:none}
@media(min-width:768px) and (min-aspect-ratio:9/10){.hero{justify-content:flex-start;padding:max(108px,17vh) 40px 0 7.5vw}}
.box{max-width:40rem;position:relative;z-index:10;pointer-events:auto}
.linkpop{position:fixed;z-index:16;display:flex;gap:6px;padding:8px;background:transparent;border:0}
.linkpop[hidden]{display:none}
.linkpop .pill,.linkpop .pill:focus{margin:0;--f:transparent;--b:#0C0C0F;background:transparent;color:#0C0C0F;font-weight:500}
.linkpop .pill:hover{--f:#0C0C0F;background:#0C0C0F;color:#fff}
.linkpop.light .pill,.linkpop.light .pill:focus{--b:#F2F2F2;color:#F2F2F2}
.linkpop.light .pill:hover{--f:#F2F2F2;background:#F2F2F2;color:#0C0C0F}
.linkpop .pill.off{opacity:.45}
.linkpop.in{animation:popIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.saynote{margin:-12px 0 24px;max-width:24em;font-size:14px;line-height:1.7;letter-spacing:.06em;color:var(--muted)}
.saynote[hidden]{display:none}
.say{margin:0 0 24px;max-width:18em;font-size:clamp(20px,5vw,24px);line-height:1.5;font-weight:400;min-height:72px;color:var(--ink);letter-spacing:-.01em}
@media(min-width:768px) and (min-aspect-ratio:9/10){.say{font-size:clamp(22px,1.9vw,30px);max-width:16em;margin-bottom:32px}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:11;display:none;justify-content:flex-start;align-items:center;padding:0 40px 30px 7.5vw;
  font-size:13px;color:var(--muted);pointer-events:none}
.bar p{margin:0;display:flex;align-items:center;gap:12px}
.bar .tags i{width:5px;height:5px;background:var(--accent);display:block}
.bar .track{position:relative;width:96px;height:1px;background:rgba(255,255,255,.18)}
.bar .fill{position:absolute;left:0;top:0;height:1px;width:0;background:var(--accent);transition:width .6s ease}
.bar #progR{font-variant-numeric:tabular-nums;color:var(--ink)}
/* the "seen n / total" counter is not shown */
.bar{display:none!important}
.caret{display:inline-block;width:1px;height:1.1em;background:var(--accent);vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.pills{display:flex;flex-wrap:wrap;row-gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.pills.on{opacity:1;transform:none}
@media(min-width:768px) and (min-aspect-ratio:9/10){.pills{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);justify-content:center;flex-wrap:nowrap}
  .pills.on{transform:translate(-50%,0)}}
@media(pointer:coarse){.pill{min-height:44px}}
@media(min-width:768px){#pills .pill{min-height:46px;padding:.3em 26px}#pills .pill.primary{padding:.3em 34px}}
#pills .pill:not(.primary){border-color:transparent;color:var(--muted);padding-left:14px;padding-right:14px}
#pills .pill:not(.primary):hover{background:transparent;color:var(--ink)}
.pill.primary{background:var(--ink);border-color:var(--ink);color:#0C0C0F;font-weight:500}
.pill.primary:hover{background:#fff;border-color:#fff}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  font-size:16px;padding:.3em 16px;margin:0 .2em .4em;white-space:nowrap;cursor:pointer;text-decoration:none;min-height:34px;transition:background-color .2s,color .2s}
@media(min-width:640px){.pill{padding:.3em 20px;gap:12px}}
.pill:hover{background:var(--ink);border-color:var(--ink);color:#0C0C0F}
.pill.line{background:transparent;border-color:var(--ink)}
.pill.line:hover{background:var(--ink);color:#0C0C0F}
.pill.line u{text-underline-offset:2px}
.pill svg{width:12px;height:12px;flex:none}

/* conversational form */
.madlib{margin:0 0 20px;font-size:clamp(18px,4vw,26px);line-height:1.9;font-weight:400;letter-spacing:-.005em}
.blank{display:inline-block;vertical-align:baseline;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:0 2px;margin:0 4px;font-size:inherit;line-height:1.2;border-radius:0}
.blank::placeholder{color:#5c5c58}
.blank:focus{outline:none;border-bottom-color:var(--stamp)}
.blank[aria-invalid="true"]{border-bottom-color:var(--stamp)}
.err{margin:-8px 0 16px;font-size:14px;color:var(--stamp);min-height:1.2em}

/* list sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(12,12,15,.96);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:auto;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .in{max-width:880px;padding:96px 20px 64px;margin:0 auto}
@media(min-width:640px){.sheet .in{padding:110px 40px 80px}}
.sheet h2{margin:0 0 6px;font-size:clamp(32px,5vw,48px);font-weight:500;letter-spacing:-.03em}
.sheet .sub{margin:0 0 28px;color:var(--muted);font-size:15px}
.sheet .close{position:fixed;top:16px;right:20px;z-index:21}
@media(min-width:640px){.sheet .close{top:22px;right:32px}}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.rows li{display:grid;grid-template-columns:3em 1fr auto;gap:2px 16px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.rows .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.rows .n.done{color:var(--stamp)}
.rows .who{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.015em;line-height:1.25;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.rows .meta{grid-column:2;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rows .act{grid-column:3;grid-row:1/span 2;display:flex;gap:4px}
@media(min-width:768px) and (min-aspect-ratio:9/10){body[data-mode=teacher] .hero{padding-top:62vh}}
/* keep text legible over the beam */
.say,.err{text-shadow:0 0 6px #0C0C0F,0 0 12px #0C0C0F,0 0 22px #0C0C0F,0 0 36px #0C0C0F}
/* tap targets */
.logo{min-height:44px}
.cta{min-height:44px;padding:0 4px}
@media(max-width:767px){.pill{min-height:44px}.pills{justify-content:center;row-gap:0}}
/* student fields */
.fields{display:grid;gap:18px;margin:0 0 20px;max-width:34rem}
.chk{display:flex;align-items:flex-start;gap:12px;margin-top:6px;cursor:pointer;font-size:clamp(16px,3.6vw,20px);color:var(--ink);user-select:none}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk i{flex:none;width:22px;height:22px;margin-top:3px;border:2px solid var(--ink);position:relative;transition:background .15s}
.chk input:checked+i{background:var(--ink)}
.chk input:checked+i::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #0C0C0F;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk input:focus-visible+i{outline:2px solid var(--stamp);outline-offset:3px}
.chk small{display:block;font-size:13px;color:#8d8d89;margin-top:2px;letter-spacing:.04em}
.fld{display:grid;gap:0;font-size:14px;color:#c9c9c5}
.fld .blank{display:block;width:100%;field-sizing:fixed;box-sizing:border-box;margin:0;padding:10px 0;min-height:44px;font-size:clamp(18px,4vw,24px);color:var(--ink)}
/* intro splash */
.intro{position:fixed;inset:0;z-index:60;background:#0C0C0F;cursor:pointer;transition:opacity 1.8s ease .3s;touch-action:manipulation}
.intro[hidden]{display:none}
.intro.out{opacity:0;pointer-events:none}
.intro .hint{position:absolute;left:0;right:0;bottom:max(48px,9vh);text-align:center;font-size:16px;letter-spacing:.08em;color:var(--muted);opacity:0;animation:hintIn .8s ease 3s forwards,hintBreath 2.6s ease-in-out 3.8s infinite;pointer-events:none;transition:opacity .4s}
.intro.out .hint{animation:none;opacity:0}
@keyframes hintIn{to{opacity:.9}}
@keyframes hintBreath{0%,100%{opacity:.9}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.intro .hint{animation:hintIn .1s ease .5s forwards}}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.intro:focus-visible{outline:none;border-radius:0}
/* gateway */
@media(max-width:767px){.box{margin:0 -20px;padding:40px 20px 0;background:linear-gradient(to top,rgba(12,12,15,.95) 80%,rgba(12,12,15,0))}}
.gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(12,12,15,.9);backdrop-filter:blur(10px);transition:opacity .35s}
.gate[hidden]{display:none}
.gate:focus,.gate:focus-visible{outline:none;border-radius:0}
.gate.out{opacity:0;pointer-events:none}
.gate .in{width:auto;max-width:100%}
.gate .pick{display:flex;justify-content:center;gap:32px}
.gate .opt{display:inline-flex;align-items:center;justify-content:center;min-width:132px;min-height:52px;padding:0 32px;background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.28);border-radius:999px;cursor:pointer;font:inherit;font-size:16px;font-weight:500;letter-spacing:.02em;transition:background-color .2s,color .2s,border-color .2s}
.gate .opt b{font:inherit}
.gate .opt:hover{background:var(--ink);color:#0C0C0F;border-color:var(--ink)}
.gate .opt:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
.gate .pw{margin:22px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;font-size:clamp(18px,3.6vw,22px)}
.gate .pw[hidden]{display:none}
.gate .pw input{width:min(260px,100%);margin:0}
.gate .gerr{min-height:22px;margin:16px 0 0;font-size:16px;color:#ff8a5c}
.rows .none{display:block;color:var(--muted);font-size:17px;border:0}

/* fallback paper when WebGL is unavailable */
.flat{position:fixed;z-index:2;right:6vw;top:50%;transform:translateY(-50%) rotate(-2deg);width:min(520px,44vw);aspect-ratio:3/2;background:#fff;border-radius:4px;box-shadow:0 40px 80px -30px rgba(0,0,0,.35);padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.flat b{font-size:42px;font-weight:500}
.flat span{color:var(--muted)}
@media(max-width:767px){.flat{right:5vw;left:5vw;width:auto;top:96px;transform:rotate(-2deg)}}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#0C0C0F;border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.caret{display:none}}

/* type scale after the TNDA 動畫期末展演 page: 14px base, small tracked labels, light weights, quiet pills */
body{font-size:14px}
.logo b{font-size:15px;font-weight:400;letter-spacing:.22em}
.logo .course{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.pill,#pills .pill{font-size:13px;font-weight:400;letter-spacing:.12em;min-height:40px;padding:0 20px;position:relative}
#pills .pill.primary,.pill.primary{padding:0 24px;font-weight:500}
.pill::before{content:"";position:absolute;inset:-4px 0}
@media(max-width:767px){.pill,#pills .pill{min-height:44px}}
.cta{font-size:13px;letter-spacing:.12em}
.say{font-size:clamp(16px,1.6vw,18px);font-weight:300;line-height:1.8;letter-spacing:.06em;max-width:22em;min-height:0}
.fld{font-size:11px;letter-spacing:.14em}
.fld .blank{font-size:14px;letter-spacing:.02em}
@media(max-width:767px){.fld .blank{font-size:16px}}
.err{font-size:12px;letter-spacing:.04em}
.gate .opt{font-size:13px;letter-spacing:.2em;text-indent:.2em;font-weight:400;min-width:120px}
.sheet h2{font-size:clamp(20px,2.4vw,26px);font-weight:400;letter-spacing:.06em}
.sheet .sub{font-size:12px;letter-spacing:.1em}
.rows .who{font-size:clamp(16px,1.6vw,18px);font-weight:400;letter-spacing:.03em}
.rows .n{font-size:12px;letter-spacing:.1em}
.rows .meta{font-size:12px;letter-spacing:.04em}
.rows .none{font-size:14px}
.toast{font-size:12px;letter-spacing:.1em}
.intro .hint{font-size:11px;letter-spacing:.24em;text-indent:.24em}

/* ── teacher tools in navbar: name search + all works ── */
.tools{display:none;align-items:center;gap:10px;margin-left:auto;margin-right:12px;min-width:0}
body[data-mode=teacher] .tools{display:flex}
.srch{position:relative;display:flex;align-items:center;min-width:0}
.srch input{width:130px;max-width:34vw;height:34px;padding:0 12px 0 34px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:13px;outline:none;transition:width .25s,border-color .2s,background .2s}
.srch input::placeholder{color:rgba(255,255,255,.5)}
.srch input:focus{width:220px;max-width:46vw;border-color:var(--accent);background:rgba(255,255,255,.1)}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.srch svg{position:absolute;left:11px;top:50%;width:14px;height:14px;margin-top:-7px;pointer-events:none;opacity:.7}
.sres{position:absolute;top:calc(100% + 8px);right:0;width:min(300px,86vw);max-height:50vh;overflow:auto;margin:0;padding:6px;list-style:none;background:rgba(12,12,15,.97);border:1px solid rgba(255,255,255,.18);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:13}
.sres[hidden]{display:none}
.sres button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:40px;padding:6px 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.sres button:hover,.sres button:focus-visible,.sres button[aria-selected=true]{background:rgba(255,255,255,.12);outline:none}
.sres small{font-size:12px;color:var(--muted);white-space:nowrap}
.sres .none{padding:12px;color:var(--muted);font-size:13px}
.tools .pill{margin:0;min-height:34px;padding:0 14px;font-size:13px;white-space:nowrap}
@media(max-width:560px){.logo .course{display:none}.tools{gap:8px;margin-right:10px}.tools .pill{padding:0 12px}.srch input{width:44px;padding:0;color:transparent;cursor:pointer}.srch input::placeholder{color:transparent}.srch input:focus{width:150px;max-width:50vw;padding:0 12px 0 36px;color:var(--ink);cursor:text}.srch input:focus::placeholder{color:rgba(255,255,255,.5)}.srch svg{left:11px}.srch input:focus ~ svg{left:12px}.tools:focus-within .pill{display:none}.srch input:focus{width:min(62vw,240px);max-width:none}.sres{position:fixed;left:12px;right:12px;top:64px;width:auto}}
/* only real controls take clicks; the text block and pill row stay see-through so the whole box (incl. its TNDA label) is clickable */
.box,.say,.pills,#form,.fields{pointer-events:none}
.box a,.box button,.box input,.box label{pointer-events:auto}
/* ── notched buttons (Uiverse / Cevorob): a bordered box whose edge segments are covered by two bars; hover widens the cut-outs ── */
.pill,.gate .opt{--f:#0C0C0F;--b:#F2F2F2;position:relative;isolation:isolate;border:2px solid var(--b);border-radius:0;background:var(--f);color:var(--ink);cursor:crosshair;user-select:none;white-space:nowrap;transition:transform .05s linear,color .2s}
.pill::before,.pill::after,.gate .opt::before,.gate .opt::after{content:"";position:absolute;inset:auto;z-index:-1;background:var(--f);transition:all .2s linear;pointer-events:none}
.pill::before,.gate .opt::before{width:calc(100% + 6px);height:calc(100% - 16px);top:8px;left:-3px}
.pill::after,.gate .opt::after{width:calc(100% - 16px);height:calc(100% + 6px);top:-3px;left:8px}
.pill:hover::before,.gate .opt:hover::before{height:calc(100% - 32px);top:16px}
.pill:hover::after,.gate .opt:hover::after{width:calc(100% - 32px);left:16px}
.pill:active,.gate .opt:active{transform:scale(.95)}
.pill:hover,.pill.line:hover,#pills .pill:not(.primary):hover,.gate .opt:hover{background:var(--f);border-color:var(--b);color:var(--ink)}
#pills .pill:not(.primary){--b:rgba(242,242,242,.42);border-color:var(--b);color:var(--muted)}
#pills .pill:not(.primary):hover{--b:#F2F2F2}
.pill.primary,#pills .pill.primary{--f:#e8e8e8;--b:#0C0C0F;background:var(--f);border-color:var(--b);color:#0C0C0F}
.pill.primary:hover,#pills .pill.primary:hover{--f:#fff;background:var(--f);border-color:var(--b);color:#0C0C0F}

  function setPeek(n){
    if(G) G.dirty = 3;
    var g = G.peekGroup; while(g.children.length) g.remove(g.children[0]);
    if(!n) return;
    // one slip standing in the slot, wide enough to read as a sheet of paper
    var sw = (G.slotW || 1.5), sd = (G.slotD || .14), w = Math.min(1.1, sw * .62), h = .3;
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), G.peekMat);
    m.position.set(0, h / 2 - .06, 0);
    m.rotation.z = -.03; m.castShadow = true;
    g.add(m);
  }

  function drawPaper(s, n, stamp){

    var c = G.paperCanvas, x = c.getContext("2d"), W = c.width, H = c.height, P = 110;
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    x.strokeStyle = "#d6d6d6"; x.lineWidth = 6; x.strokeRect(3, 3, W - 6, H - 6);
    // header
    x.fillStyle = "#6B6B68"; x.font = '400 44px "Inter Tight", "Noto Sans TC", sans-serif'; x.textBaseline = "alphabetic";
    x.fillText("TNDA", P, 150);
    var tag = "數位創意創業思維　MVP 檢視"; x.fillText(tag, W - P - x.measureText(tag).width, 150);
    x.fillStyle = "#000"; x.fillRect(P, 190, W - P * 2, 3);
    // name
    var seq = s.uid ? priSeqOf(s) : 0, nameMax = W - P * 2 - (seq ? 330 : 0);
    var size = 176; x.font = '500 ' + size + 'px "Noto Sans TC", "Inter Tight", sans-serif';
    while(x.measureText(s.name).width > nameMax && size > 90){ size -= 8; x.font = '500 ' + size + 'px "Noto Sans TC", "Inter Tight", sans-serif'; }
    x.fillText(s.name, P - 6, 420);
    if(seq){   // upload order number, top right of the name row
      var ns = (seq < 10 ? "0" : "") + seq;
      x.textAlign = "right"; x.fillStyle = "#6B6B68"; x.font = '400 40px "Inter Tight", "Noto Sans TC", sans-serif'; x.fillText("優先序號", W - P, 270);
      x.fillStyle = "#000"; x.font = '500 170px "Inter Tight", "Noto Sans TC", sans-serif'; x.fillText(ns, W - P, 420);
      x.textAlign = "left";
    }
    // intro
    x.fillStyle = "#222"; x.font = '400 72px "Noto Sans TC", "Inter Tight", sans-serif';
    wrap(x, introOf(s.it) || "（沒有寫介紹）", P, 580, W - P * 2, 104, 3);
    // two buttons on the paper: 打開 MVP / 打開資料 (hit-tested on click, see paperButtonAt); no raw URLs printed
    G.paperLinks = [];
    var mvpU = s.it.url ? safeUrl(s.it.url) : null, dataU = s.it.data ? safeUrl(s.it.data) : null;
    function paperBtn(label, url, msg, bx){
      var bw = 560, bh = 150, by = H - 330, on = G.paperHover === G.paperLinks.length;   // hovered = inverted
      if(on && url){ x.fillStyle = "#000"; x.fillRect(bx, by, bw, bh); }
      x.lineWidth = 8; x.strokeStyle = url ? "#000" : "#c4c4c0"; x.strokeRect(bx, by, bw, bh);
      x.fillStyle = url ? (on ? "#fff" : "#000") : "#a8a8a4"; x.font = '500 62px "Noto Sans TC", "Inter Tight", sans-serif'; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(label, bx + bw / 2, by + bh / 2 + 3); x.textAlign = "left"; x.textBaseline = "alphabetic";
      G.paperLinks.push({ x: bx, y: by, w: bw, h: bh, url: url, msg: msg });
    }
    paperBtn("打開 MVP", mvpU, "這位同學的 MVP 還沒完成", P);
    paperBtn("打開資料", dataU, "這份沒有附資料連結", P + 560 + 50);
    // the 圈選章 is pressed on after the paper lands (stamp: 0 = none, 0..1 = landing)
    if(n && stamp > 0) drawVoteMark(x, W - P - 230, H - 360, 220, stamp);
    G.tex.needsUpdate = true;
  }
  function wrap(x, text, left, top, maxW, lh, maxLines){
    var lines = [], line = "";
    Array.from(text).forEach(function(ch){
      if(x.measureText(line + ch).width > maxW){ lines.push(line); line = ch; } else line += ch;
    });
    if(line) lines.push(line);
    if(lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + "⋯"; }
    lines.forEach(function(l, i){ x.fillText(l, left, top + i * lh); });
  }

  function ease(t){ return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeOut(t){ return 1 - Math.pow(1 - t, 3); }

  // out: from slot → up → spin → rest pose in front of the camera
  function flyOut(){
    return new Promise(function(resolve){
      var rest = restPose(), start = slotWorld();
      var p = G.paper; p.visible = true;
      if(reduce){ placePaperAtRest(); G.crispTarget = 1; resolve(); return; }
      var s0 = .32 * G.rig.scale.x;
      var standUp = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, G.rig.rotation.y, 0));
      var peak = start.clone().add(new THREE.Vector3(-.4, 3.2, 1.2));
      var t0 = performance.now(), dur = 1700;
      G.flight = function(now){
        var t = Math.min(1, (now - t0) / dur);
        // rise straight out of the slot first, then arc to the camera
        var rise = Math.min(1, t / .25), arc = Math.max(0, (t - .18) / .82), e = ease(arc);
        var a = start.clone().add(new THREE.Vector3(0, 1.1 * easeOut(rise), 0));
        var b = a.clone().lerp(peak, .5), pos = new THREE.Vector3();
        // quadratic bezier a → peak → rest
        pos.copy(a).multiplyScalar((1 - e) * (1 - e)).add(peak.clone().multiplyScalar(2 * (1 - e) * e)).add(rest.pos.clone().multiplyScalar(e * e));
        p.position.copy(pos);
        var spin = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(e * Math.PI) * .5, (1 - e) * Math.PI * 2, Math.sin(e * Math.PI) * -.35));
        var q = standUp.clone().slerp(rest.quat, e).multiply(spin);
        p.quaternion.copy(q);
        p.scale.setScalar(s0 + (rest.scale - s0) * easeOut(arc));
        if(t >= 1){ G.flight = null; placePaperAtRest(); G.float = performance.now(); G.crispTarget = 1; resolve(); }
      };
    });
  }
  // the stamp comes down onto the paper, with a small press on the sheet
  function pressStamp(s, n){
    return new Promise(function(resolve){
      if(reduce){ drawPaper(s, n, 1); resolve(); return; }
      var t0 = performance.now() + 250, dur = 320, bumped = false;
      (function step(){
        var t = (performance.now() - t0) / dur;
        if(t < 0){ requestAnimationFrame(step); return; }
        t = Math.min(1, t);
        drawPaper(s, n, 1 - Math.pow(1 - t, 3));
        if(t >= .7 && !bumped){ bumped = true; G.press = performance.now(); }
        if(t < 1) requestAnimationFrame(step); else resolve();
      })();
    });
  }
  // in: from rest pose (or the hero) into the slot
  function flyIn(){
    G.crispTarget = 0; G.crispOn = 0;
    return new Promise(function(resolve){
      var p = G.paper;
      if(reduce){ p.visible = false; resolve(); return; }
      if(!p.visible){ placePaperAtRest(); p.visible = true; }
      var from = p.position.clone(), q0 = p.quaternion.clone(), s0 = p.scale.x;
      var end = slotWorld(), peak = end.clone().add(new THREE.Vector3(-.3, 3.4, 1));
      var qEnd = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, G.rig.rotation.y, 0));
      var sEnd = .3 * G.rig.scale.x, t0 = performance.now(), dur = 1300;
      G.flight = function(now){
        var t = Math.min(1, (now - t0) / dur), e = ease(Math.min(1, t / .8)), sink = Math.max(0, (t - .8) / .2);
        var pos = from.clone().multiplyScalar((1 - e) * (1 - e)).add(peak.clone().multiplyScalar(2 * (1 - e) * e)).add(end.clone().add(new THREE.Vector3(0, .9, 0)).multiplyScalar(e * e));
        pos.y -= sink * 1.1;
        p.position.copy(pos);
        var spin = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, e * Math.PI * 2, Math.sin(e * Math.PI) * .3));
        p.quaternion.copy(q0.clone().slerp(qEnd, e).multiply(spin));
        p.scale.setScalar(s0 + (sEnd - s0) * e);
        if(t >= 1){ G.flight = null; p.visible = false; resolve(); }
      };
    });
  }
  // away: current paper drops off to the side before the next one
  function flyAway(){
    G.crispTarget = 0; G.crispOn = 0;
    return new Promise(function(resolve){
      var p = G.paper;
      if(!p.visible || reduce){ p.visible = false; resolve(); return; }
      var from = p.position.clone(), q0 = p.quaternion.clone(), t0 = performance.now(), dur = 520;
      var qEnd = q0.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-.6, .5, .9)));
      G.flight = function(now){
        var t = Math.min(1, (now - t0) / dur), e = t * t;
        p.position.copy(from.clone().add(new THREE.Vector3(-1.5 * e, -5 * e, -1 * e)));
        p.quaternion.copy(q0.clone().slerp(qEnd, e));
        if(t >= 1){ G.flight = null; p.visible = false; resolve(); }
      };
    });
  }

  window.__introOn = true;
  var last = 0, leaveT = 0;
  var P = [], W = 0, H = 0, dpr = 1, rs = 1, ptr = { x:-1e4, y:-1e4 }, t0 = 0, raf = 0, gone = false, fading = false;
  var cols = []; for(var i = 0; i < NB; i++){ var k = i / (NB - 1); cols.push("rgb(" + INK.map(function(c, j){ return Math.round(c + (HI[j] - c) * k); }).join(",") + ")"); }

  function build(){
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    LINES = W < 600 ? ["TNDA", "數位創意", "創業思維"] : ["TNDA", "數位創意創業思維"];
    var fs = Math.min(96, Math.max(36, W * (W < 600 ? .17 : .085))), face = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
    var off = document.createElement("canvas"), o = off.getContext("2d"); off.width = W; off.height = H;
    o.font = "800 " + fs + "px " + face; var wide = Math.max.apply(null, LINES.map(function(t){ return o.measureText(t).width; }));
    if(wide > W * .88){ fs = fs * W * .88 / wide; }
    o.font = "800 " + fs + "px " + face; o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
    var lh = fs * 1.2, y0 = H / 2 - lh * (LINES.length - 1) / 2;
    LINES.forEach(function(t, i){ o.fillText(t, W / 2, y0 + i * lh); });
    rs = fs / 96;
    var step = Math.max(3, Math.round(OPT.density * Math.max(.6, rs))), d = o.getImageData(0, 0, W, H).data, pts = [], minX = 1e9, maxX = -1e9;
    for(var y = 0; y < H; y += step) for(var x = 0; x < W; x += step){ if(d[(y * W + x) * 4 + 3] > 128){ pts.push([x, y]); if(x < minX) minX = x; if(x > maxX) maxX = x; } }
    var span = Math.max(1, maxX - minX), sc = OPT.scatter * Math.max(.6, rs);
    P = pts.map(function(q){
      var a = Math.random() * 6.2832, r = Math.sqrt(Math.random()) * sc;
      return { hx:q[0], hy:q[1], x:q[0] + Math.cos(a) * r, y:q[1] + Math.sin(a) * r, vx:0, vy:0, ph:Math.random() * 6.2832,
               delay: reduce ? 0 : (q[0] - minX) / span * (OPT.gather - 900) + Math.random() * OPT.stagger };
    });
    if(reduce) P.forEach(function(p){ p.x = p.hx; p.y = p.hy; });
  }

  function frame(now){
    raf = requestAnimationFrame(frame);
    var dt = Math.min(3, Math.max(.3, (now - (last || now)) / 16.667)); last = now;
    var el = now - t0, i, p, b, buckets = [], rad = OPT.size * Math.max(.6, rs) / 2 * dpr;
    for(i = 0; i < NB; i++) buckets.push([]);
    var R = OPT.radius * Math.max(.7, rs);
    for(i = 0; i < P.length; i++){
      p = P[i]; var age = el - p.delay; if(age < 0) continue;
      var ox = Math.sin(now * .0011 + p.ph) * 1.4 * OPT.drift, oy = Math.cos(now * .0014 + p.ph) * 1.4 * OPT.drift;
      if(!leaveT){ p.vx += (p.hx + ox - p.x) * .045 * dt; p.vy += (p.hy + oy - p.y) * .045 * dt; }
      var dx = p.x - ptr.x, dy = p.y - ptr.y, dd = dx * dx + dy * dy;
      if(dd < R * R){ var d = Math.sqrt(dd) || 1, f = (1 - d / R) * OPT.repel * .06; p.vx += dx / d * f * 3 * dt; p.vy += dy / d * f * 3 * dt; }
      var dm = Math.pow(leaveT ? .988 : .86, dt); p.vx *= dm; p.vy *= dm; p.x += p.vx * dt; p.y += p.vy * dt;
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      b = Math.min(NB - 1, Math.floor(sp / 2.2 * (NB - 1)));
      buckets[b].push(p, Math.min(1, age / 420) * (leaveT ? Math.max(0, 1 - (now - leaveT) / 2000) : 1));
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    for(b = 0; b < NB; b++){
      var arr = buckets[b]; if(!arr.length) continue;
      ctx.fillStyle = cols[b]; ctx.beginPath();
      for(i = 0; i < arr.length; i += 2){ var q = arr[i], r = rad * arr[i + 1], cx = q.x * dpr, cy = q.y * dpr; ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, 6.2832); }
      ctx.fill();
    }
  }

  function enter(cx, cy){
    if(fading) return; fading = true;
    if(!reduce){ leaveT = performance.now(); P.forEach(function(p){ var dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1, k = OPT.burst * (1.5 + Math.random() * 5); p.vx += dx / d * k + (Math.random() - .5) * 4; p.vy += dy / d * k + (Math.random() - .5) * 4 - Math.random() * .8; }); }
    root.classList.add("out"); window.__introOn = false;
    setTimeout(function(){
      gone = true; root.hidden = true; cancelAnimationFrame(raf); window.__introOn = false;
      var g = document.getElementById("gate"); if(g && !g.hidden) g.focus({ preventScroll:true });
    }, 2300);
  }

  root.addEventListener("pointermove", function(e){ ptr.x = e.clientX; ptr.y = e.clientY; });
  root.addEventListener("pointerleave", function(){ ptr.x = ptr.y = -1e4; });
  root.addEventListener("pointerdown", function(e){ ptr.x = ptr.y = -1e4; enter(e.clientX, e.clientY); });
  document.addEventListener("keydown", function(e){ if(!gone && !fading && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); e.stopPropagation(); enter(W / 2, H / 2); } }, true);
  var rz; window.addEventListener("resize", function(){ if(gone) return; clearTimeout(rz); rz = setTimeout(function(){ build(); P.forEach(function(p){ p.x = p.hx; p.y = p.hy; p.delay = 0; }); }, 150); });

  window.showIntro = function(){
    cancelAnimationFrame(raf); gone = false; fading = false; leaveT = 0; last = 0; ptr.x = ptr.y = -1e4;
    root.hidden = false; root.classList.remove("out"); window.__introOn = true; start(true);
  };
  function start(again){ if(gone) return; build(); t0 = performance.now(); raf = requestAnimationFrame(frame); root.focus({ preventScroll:true }); }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
})();
</script>
</body>
</html>
